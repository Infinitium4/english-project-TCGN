<VirtualHost *:80>
    # Replace with your VM's hostname or domain.
    ServerName tcgn.local
    DocumentRoot /var/www/tcgn/public
    DirectoryIndex index.php

    <Directory /var/www/tcgn/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/tcgn-error.log
    CustomLog ${APACHE_LOG_DIR}/tcgn-access.log combined
</VirtualHost>
